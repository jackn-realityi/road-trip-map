<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CT → Seattle Road Trip Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0f1620; --panel:#16202c; --panel-border:#26333f; --text:#e7edf3; --muted:#93a3b3;
  }
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:340px;min-width:280px;background:var(--panel);border-right:1px solid var(--panel-border);overflow-y:auto;padding:16px;box-sizing:border-box;}
  #sidebar h1{font-size:17px;margin:0 0 4px;}
  #sidebar .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  #version-select{
    width:100%;margin-bottom:14px;padding:10px 12px;border-radius:8px;
    background:#101923;color:var(--text);border:1px solid var(--panel-border);
    font-size:13px;font-weight:600;
  }
  .day-card{border:1px solid var(--panel-border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#101923;}
  .day-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;}
  .swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .day-header .label{flex:1;font-size:13.5px;font-weight:600;}
  .day-header .stat{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
  .day-header .toggle{font-size:11px;color:var(--muted);}
  #trip-totals{
    display:flex;gap:10px;margin-bottom:14px;padding:10px 12px;border-radius:8px;
    background:#101923;border:1px solid var(--panel-border);font-size:12.5px;
  }
  #trip-totals .stat-block{flex:1;text-align:center;}
  #trip-totals .stat-value{font-size:16px;font-weight:700;color:#fff;display:block;}
  #trip-totals .stat-label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;}
  .day-body{padding:0 12px 12px 34px;font-size:12.5px;color:var(--muted);display:none;}
  .day-body.open{display:block;}
  .day-body a{color:#7cc4ff;text-decoration:none;}
  .day-body a:hover{text-decoration:underline;}
  .day-body ul{margin:6px 0;padding-left:16px;}
  .day-body li{margin-bottom:3px;}
  .checkbox{width:15px;height:15px;flex-shrink:0;}
  #map{flex:1;height:100%;}
  .leaflet-popup-content-wrapper{background:#16202c;color:var(--text);border-radius:8px;}
  .leaflet-popup-tip{background:#16202c;}
  .leaflet-popup-content b{color:#fff;}
  .leaflet-popup-content{font-size:12.5px;}
  #legend-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}

  #menu-btn{display:none;}

  #live-location-btn{
    display:none;position:fixed;bottom:20px;right:20px;z-index:1100;
    align-items:center;gap:8px;padding:12px 18px;border-radius:999px;
    background:#e74c3c;color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);border:none;
  }
  #live-location-btn.visible{display:flex;}
  #live-location-btn .pulse-dot{
    width:9px;height:9px;border-radius:50%;background:#fff;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,0.6);}
    70%{box-shadow:0 0 0 8px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }

  @media (max-width: 768px){
    #app{position:relative;}
    #menu-btn{
      display:flex;align-items:center;justify-content:center;
      position:fixed;top:12px;left:12px;z-index:1100;
      width:44px;height:44px;border-radius:10px;border:1px solid var(--panel-border);
      background:var(--panel);color:var(--text);font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,0.4);
    }
    #sidebar{
      position:fixed;top:0;left:0;height:100%;width:85%;max-width:340px;
      transform:translateX(-100%);transition:transform 0.25s ease;
      z-index:1050;box-shadow:2px 0 16px rgba(0,0,0,0.5);
      padding-top:64px;
    }
    #sidebar.open{transform:translateX(0);}
    #sidebar-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1040;
    }
    #sidebar-backdrop.open{display:block;}
    #map{width:100%;}
    .day-header{padding:12px;}
    .checkbox{width:20px;height:20px;}
    .leaflet-popup-content{font-size:14px;}
  }
</style>
</head>

<button id="menu-btn" aria-label="Toggle trip days">☰</button>
<div id="sidebar-backdrop"></div>
<a id="live-location-btn" target="_blank" rel="noopener">

    <div id="day-list"></div>
    <div id="legend-note">Routes are traced along actual roads (via OSRM routing). Use the "Open in Google Maps" links for live turn-by-turn directions.</div>
  </div>
  <div id="map"></div>
</div>

// Decode a Google/OSRM encoded polyline (precision 5) into [lat, lng] pairs
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0, coordinates = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;

    shift = 0; result = 0;
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;

    coordinates.push([lat / 1e5, lng / 1e5]);
  }
  return coordinates;
}

// Format decimal hours like "57.25" as "57h 15m" for display
function formatHours(totalHours) {
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

const map = L.map('map', { zoomControl: true }).setView([43.5, -98], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const dayListEl = document.getElementById('day-list');
const versionSelect = document.getElementById('version-select');
let currentLayerGroups = {};

function renderVersion(versionKey) {
  // Clear any existing layers and sidebar cards from the previous version
  Object.values(currentLayerGroups).forEach(g => map.removeLayer(g));
  currentLayerGroups = {};
  dayListEl.innerHTML = '';

  const days = tripVersions[versionKey].days;
  let allBounds = [];

  const totalMiles = days.reduce((sum, d) => sum + (d.miles || 0), 0);
  const totalHours = days.reduce((sum, d) => sum + (d.hours || 0), 0);
  document.getElementById('total-miles').textContent = totalMiles.toLocaleString();
  document.getElementById('total-hours').textContent = formatHours(totalHours);
  document.getElementById('total-days').textContent = days.length;

  days.forEach(day => {
    const group = L.layerGroup().addTo(map);
    currentLayerGroups[day.id] = group;

    const latlngs = day.stops.map(s => [s.lat, s.lng]);
    latlngs.forEach(ll => allBounds.push(ll));

    if (day.route) {
      const roadPath = decodePolyline(day.route);
      L.polyline(roadPath, { color: day.color, weight: 4, opacity: 0.85 }).addTo(group);
    } else {
      L.polyline(latlngs, { color: day.color, weight: 4, opacity: 0.75, dashArray: '6 6' }).addTo(group);
    }

    day.stops.forEach((stop, i) => {
      const isEndpoint = i === 0 || i === day.stops.length - 1;
      const marker = L.circleMarker([stop.lat, stop.lng], {
        radius: isEndpoint ? 8 : 6,
        fillColor: day.color,
        color: '#fff',
        weight: isEndpoint ? 2 : 1.5,
        fillOpacity: 0.95
      }).addTo(group);
      marker.bindPopup(`<b>${stop.name}</b><br>${stop.note}<br><span style="color:#93a3b3">${day.title}</span>`);
    });

    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-header">
        <input type="checkbox" class="checkbox" checked data-day="${day.id}">
        <span class="swatch" style="background:${day.color}"></span>
        <span class="label">${day.title}</span>
        <span class="stat">${day.miles ? `${day.miles} mi · ${formatHours(day.hours)}` : ''}</span>
        <span class="toggle">▾</span>
      </div>
      <div class="day-body">
        <div>${day.summary}</div>
        <ul>${day.stops.map(s => `<li><b>${s.name}</b> — ${s.note}</li>`).join('')}</ul>
        <a href="${day.gmaps}" target="_blank" rel="noopener">Open Day ${day.id} route in Google Maps ↗</a>
      </div>
    `;
    dayListEl.appendChild(card);

    const header = card.querySelector('.day-header');
    const body = card.querySelector('.day-body');
    const toggleArrow = card.querySelector('.toggle');
    header.addEventListener('click', (e) => {
      if (e.target.classList.contains('checkbox')) return;
      body.classList.toggle('open');
      toggleArrow.textContent = body.classList.contains('open') ? '▴' : '▾';
      if (body.classList.contains('open')) {
        map.fitBounds(day.stops.map(s => [s.lat, s.lng]), { padding: [40,40] });
      }
    });

    const checkbox = card.querySelector('.checkbox');
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        group.addTo(map);
      } else {
        map.removeLayer(group);
      }
    });
  });

  map.fitBounds(allBounds, { padding: [30,30] });
}

renderVersion(versionSelect.value);
versionSelect.addEventListener('change', () => renderVersion(versionSelect.value));

// Mobile sidebar drawer toggle
const menuBtn = document.getElementById('menu-btn');
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('sidebar-backdrop');

function openSidebar() {
  sidebarEl.classList.add('open');
  backdropEl.classList.add('open');
}
function closeSidebar() {
  sidebarEl.classList.remove('open');
  backdropEl.classList.remove('open');
  setTimeout(() => map.invalidateSize(), 260);
}
menuBtn.addEventListener('click', () => {
  if (sidebarEl.classList.contains('open')) closeSidebar();
  else openSidebar();
});
backdropEl.addEventListener('click', closeSidebar);

// Auto-close the drawer on mobile after picking a route from Google Maps.
// Delegated on the container so it keeps working after renderVersion() rebuilds the list.
dayListEl.addEventListener('click', (e) => {
  if (e.target.tagName === 'A' && window.matchMedia('(max-width: 768px)').matches) {
    setTimeout(closeSidebar, 200);
  }
});

window.addEventListener('resize', () => map.invalidateSize());

// Load config.json to conditionally show the live-location button.
// Edit config.json directly on github.com (even from a phone browser) to
// toggle "showLiveLocation" and update "liveLocationUrl" — no code changes needed.
fetch('config.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(cfg => {
    if (!cfg) return;
    const btn = document.getElementById('live-location-btn');
    if (cfg.showLiveLocation && cfg.liveLocationUrl) {
      btn.href = cfg.liveLocationUrl;
      btn.classList.add('visible');
    }
  })
  .catch(() => { /* config.json missing or unreachable — button stays hidden */ });
</script>
