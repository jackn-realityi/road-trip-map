<style>
  :root{
    --bg:#0f1620; --panel:#16202c; --panel-border:#26333f; --text:#e7edf3; --muted:#93a3b3;
  }
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:340px;min-width:280px;background:var(--panel);border-right:1px solid var(--panel-border);overflow-y:auto;padding:16px;box-sizing:border-box;}
  #sidebar h1{font-size:17px;margin:0 0 4px;}
  #sidebar .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .day-card{border:1px solid var(--panel-border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#101923;}
  .day-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;}
  .swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .day-header .label{flex:1;font-size:13.5px;font-weight:600;}
  .day-header .toggle{font-size:11px;color:var(--muted);}
  .day-body{padding:0 12px 12px 34px;font-size:12.5px;color:var(--muted);display:none;}
  .day-body.open{display:block;}
  .day-body a{color:#7cc4ff;text-decoration:none;}
  .day-body a:hover{text-decoration:underline;}
  .day-body ul{margin:6px 0;padding-left:16px;}
  .day-body li{margin-bottom:3px;}
  .checkbox{width:15px;height:15px;flex-shrink:0;}
  #map{flex:1;height:100%;}
  .leaflet-popup-content-wrapper{background:#16202c;color:var(--text);border-radius:8px;}
  .leaflet-popup-tip{background:#16202c;}
  .leaflet-popup-content b{color:#fff;}
  .leaflet-popup-content{font-size:12.5px;}
  #legend-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
</style>

// Decode a Google/OSRM encoded polyline (precision 5) into [lat, lng] pairs
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0, coordinates = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;

    shift = 0; result = 0;
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;

    coordinates.push([lat / 1e5, lng / 1e5]);
  }
  return coordinates;
}

const map = L.map('map', { zoomControl: true }).setView([43.5, -98], 5);

}).addTo(map);

const dayListEl = document.getElementById('day-list');
const layerGroups = {};
let allBounds = [];

days.forEach(day => {
  const group = L.layerGroup().addTo(map);
  layerGroups[day.id] = group;

  const latlngs = day.stops.map(s => [s.lat, s.lng]);
  latlngs.forEach(ll => allBounds.push(ll));

  if (day.route) {
    const roadPath = decodePolyline(day.route);
    L.polyline(roadPath, { color: day.color, weight: 4, opacity: 0.85 }).addTo(group);
  } else {
    L.polyline(latlngs, { color: day.color, weight: 4, opacity: 0.75, dashArray: '6 6' }).addTo(group);
  }

  day.stops.forEach((stop, i) => {
    const isEndpoint = i === 0 || i === day.stops.length - 1;
    const marker = L.circleMarker([stop.lat, stop.lng], {
      radius: isEndpoint ? 8 : 6,
      fillColor: day.color,
      color: '#fff',
      weight: isEndpoint ? 2 : 1.5,
      fillOpacity: 0.95
    }).addTo(group);
    marker.bindPopup(`<b>${stop.name}</b><br>${stop.note}<br><span style="color:#93a3b3">${day.title}</span>`);
  });

  const card = document.createElement('div');
  card.className = 'day-card';
  card.innerHTML = `
    <div class="day-header">
      <input type="checkbox" class="checkbox" checked data-day="${day.id}">
      <span class="swatch" style="background:${day.color}"></span>
      <span class="label">${day.title}</span>
      <span class="toggle">▾</span>
    </div>
    <div class="day-body">
      <div>${day.summary}</div>
      <ul>${day.stops.map(s => `<li><b>${s.name}</b> — ${s.note}</li>`).join('')}</ul>
      <a href="${day.gmaps}" target="_blank" rel="noopener">Open Day ${day.id} route in Google Maps ↗</a>
    </div>
  `;
  dayListEl.appendChild(card);

  const header = card.querySelector('.day-header');
  const body = card.querySelector('.day-body');
  const toggleArrow = card.querySelector('.toggle');
  header.addEventListener('click', (e) => {
    if (e.target.classList.contains('checkbox')) return;
    body.classList.toggle('open');
    toggleArrow.textContent = body.classList.contains('open') ? '▴' : '▾';
    if (body.classList.contains('open')) {
      map.fitBounds(day.stops.map(s => [s.lat, s.lng]), { padding: [40,40] });
    }
  });

  const checkbox = card.querySelector('.checkbox');
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) {
      group.addTo(map);
    } else {
      map.removeLayer(group);
    }
  });
});

map.fitBounds(allBounds, { padding: [30,30] });
